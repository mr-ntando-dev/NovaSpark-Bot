##############################################################
#  NovaSpark Bot v7 — Deployment manifest
#  Official hosting: novaspark-nodes.zone.id
#  Also compatible with any Node.js host or VPS
##############################################################

services:
  - type: worker
    name: novaspark-bot
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node index.js

    envVars:
      - key: NODE_ENV
        value: production

      # Required — your WhatsApp session string (NovaSpark!...)
      - key: SESSION_ID
        sync: false

      - key: PREFIX
        value: "."

      - key: BOT_NAME
        value: "NovaSpark Bot"
