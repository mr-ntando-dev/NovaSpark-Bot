# ⚡ NovaSpark Multi-Hosting — Render Deploy Config
# Each service = independent hosting panel with its own bot capacity.
# To add more servers: duplicate a service block, change name + SERVER_ID.
# 5 servers x 10 bots = 50 bots total across Render free tier.

services:

  # ── Pair Server (web pairing panel — the public-facing entry point) ──
  - type: web
    name: novaspark-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node pair-server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # ── Server 1 ── (10 bots)
  - type: web
    name: novaspark-hosting-1
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node hosting/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MAX_BOTS
        value: 10
      - key: SERVER_ID
        value: server-1

  # ── Server 2 ── (10 bots)
