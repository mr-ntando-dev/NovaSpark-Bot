##############################################################
#  NovaSpark Bot — Render deployment manifest
#  Deploy as a Web Service so the Admin Panel is reachable
#  and Render's health checks pass.
#  Persistent disk keeps WhatsApp session across restarts.
##############################################################

services:
  - type: web                  # Web Service — exposes HTTP for the Admin Panel
    name: novaspark-bot
    runtime: node
    region: oregon             # Change to "frankfurt" for lower Africa latency
    plan: starter              # $7/month — stays alive 24/7

    # ── Build ────────────────────────────────────────────────
    buildCommand: npm install

    # ── Start (bot + admin panel in one process) ─────────────
    startCommand: node server.js

    # ── Health check (Render pings this to confirm the service is up) ──
    healthCheckPath: /health

    # ── Auto-deploy on push to main ──────────────────────────
    autoDeploy: true

    # ── Persistent disk (keeps WhatsApp session files) ───────
    disk:
      name: session-data
      mountPath: /opt/render/project/src/session
      sizeGB: 1

    # ── Environment variables ─────────────────────────────────
    # Set these in the Render dashboard under Environment
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      # ── Admin Panel credentials ────────────────────────────
      - key: ADMIN_USERNAME
        value: novaspark

      - key: ADMIN_PASSWORD
        value: ntando

      - key: SESSION_SECRET
        generateValue: true     # Render auto-generates a secure random string

      # ── Bot session (set in dashboard, never commit to git) ──
      - key: SESSION_ID
        sync: false

      # ── Session directory — matches the persistent disk mountPath ────
      - key: SESSION_DIR
        value: /opt/render/project/src/session

      # ── Optional AI API keys ──────────────────────────────
      - key: OPENAI_API_KEY
        sync: false

      - key: DEEPAI_API_KEY
        sync: false
