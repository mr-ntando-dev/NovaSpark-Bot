services:
  - type: web
    name: novaspark-api
    env: node
    buildCommand: npm install
    startCommand: node api/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NOVASPARK_API_KEY
        generateValue: true   # Render auto-generates a secret key
      - key: OPENWEATHER_KEY
        sync: false           # Set manually in Render dashboard
